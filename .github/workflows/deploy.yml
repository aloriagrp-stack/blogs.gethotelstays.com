name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install || true

      - name: Generate static pages
        run: node generate_static_pages.js || echo "Skipping static page generation"

      - name: Generate sitemap
        run: node generate_sitemap.js || echo "Skipping sitemap generation"

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: /public_html/blogs.gethotelstays.com/
          exclude: |
            .git*
            .github*
            node_modules*
            *.log
            README.md
            generate_*.js
            package*.json
