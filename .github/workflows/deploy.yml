name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static pages
        run: node generate_static_pages.js || echo "Skipping static generation"

      - name: Generate sitemap
        run: node generate_sitemap.js || echo "Skipping sitemap generation"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to cPanel via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Deploying blogs.gethotelstays.com to cPanel..."
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<'LFTPEOF'
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror --reverse --no-perms --verbose \
            -x '^\.' \
            -x '^node_modules/' \
            -x '^admin/' \
            -x '^generate_' \
            -x '^package' \
            -x 'README.md' \
            -x '\.log$' \
            . ./blogs.gethotelstays.com/
          bye
          LFTPEOF
          echo "Blogs deployment completed!"
