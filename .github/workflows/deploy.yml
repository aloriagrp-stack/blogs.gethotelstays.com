name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install || true

      - name: Generate static pages
        run: node generate_static_pages.js || echo "Skipping"

      - name: Generate sitemap
        run: node generate_sitemap.js || echo "Skipping"

      - name: Deploy via FTP
        run: |
          apt-get update -qq && apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
            mirror --reverse --verbose --delete --exclude .git/ --exclude .github/ --exclude node_modules/ --exclude generate_*.js --exclude package*.json --exclude README.md --exclude *.log . /public_html/blogs.gethotelstays.com/;
            quit
          "
