name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install || true

      - name: Generate static pages
        run: node generate_static_pages.js || echo "Skipping static page generation"

      - name: Generate sitemap
        run: node generate_sitemap.js || echo "Skipping sitemap generation"

      - name: Debug - Check secrets
        run: |
          echo "=== Checking Secrets ==="
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "❌ FTP_SERVER is MISSING"
          else
            echo "✅ FTP_SERVER is set"
          fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "❌ FTP_USERNAME is MISSING"
          else
            echo "✅ FTP_USERNAME is set"
          fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ FTP_PASSWORD is MISSING"
          else
            echo "✅ FTP_PASSWORD is set"
          fi

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/blogs.gethotelstays.com/
          exclude: |
            .git*
            .github*
            node_modules*
            *.log
            README.md
            generate_*.js
            package*.json
