name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static pages
        run: node generate_static_pages.js || echo "Skipping static generation"

      - name: Generate sitemap
        run: node generate_sitemap.js || echo "Skipping sitemap generation"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to cPanel via lftp
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST || secrets.FTP_HOSTNAME }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "ERROR: FTP Credentials missing in GitHub Secrets!"
            exit 1
          fi

          # Clean host string (strip ftp:// or trailing slashes)
          CLEAN_HOST=$(echo "$FTP_SERVER" | sed -e 's|^ftp://||' -e 's|^ftps://||' -e 's|/$||')

          echo "Attempting connection to Primary Host: $CLEAN_HOST as User: $FTP_USER..."

          # Function to run lftp mirror
          run_lftp() {
            HOST_TO_TRY="$1"
            echo "--- Trying FTP Host: $HOST_TO_TRY ---"
            lftp <<LFTPEOF
            set ftp:ssl-allow no
            set ftp:passive-mode yes
            set net:timeout 30
            set net:max-retries 2
            debug 3
            open -u "$FTP_USER","$FTP_PASS" "$HOST_TO_TRY"
            mirror --reverse --no-perms --verbose \
              -x '^\.' \
              -x '^node_modules/' \
              -x '^admin/' \
              -x '^generate_' \
              -x '^package' \
              -x 'README.md' \
              -x '\.log$' \
              . .
            bye
          LFTPEOF
          }

          # Try user provided host first
          if run_lftp "$CLEAN_HOST"; then
            echo "Deploy successful via $CLEAN_HOST!"
            exit 0
          fi

          echo "Primary host $CLEAN_HOST failed. Trying direct cPanel server hostname: neo.herosite.pro..."
          if run_lftp "neo.herosite.pro"; then
            echo "Deploy successful via direct cPanel server host neo.herosite.pro!"
            exit 0
          fi

          echo "ERROR: All FTP connection attempts failed."
          exit 1
