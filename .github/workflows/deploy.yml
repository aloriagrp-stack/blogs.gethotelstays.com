name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install || true

      - name: Generate static pages
        run: node generate_static_pages.js || echo "Skipping"

      - name: Generate sitemap
        run: node generate_sitemap.js || echo "Skipping"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to cPanel via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          mirror -R --verbose --delete \
            --exclude .git/ \
            --exclude .github/ \
            --exclude node_modules/ \
            --exclude generate_sitemap.js \
            --exclude generate_static_pages.js \
            --exclude package.json \
            --exclude package-lock.json \
            --exclude README.md \
            --exclude admin/ \
            . /public_html/blogs.gethotelstays.com/
          bye
          EOF
